# sharp and unrs-resolver ship native binaries and need their install scripts
# to run. pnpm 11 blocks build scripts unless they are allowlisted here.
allowBuilds:
  sharp: true
  unrs-resolver: true

# Dependency pins. pnpm 11 reads these here rather than from package.json.
overrides:
  postcss: "8.5.26"
  sharp: "0.35.3"
